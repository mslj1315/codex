services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?AUTH_TOKEN_SECRET is required}
      MODEL_PROVIDER: ${MODEL_PROVIDER:?MODEL_PROVIDER is required}
      MODEL_MODEL: ${MODEL_MODEL:?MODEL_MODEL is required}
      MODEL_API_KEY: ${MODEL_API_KEY:?MODEL_API_KEY is required}
      MODEL_BASE_URL: ${MODEL_BASE_URL:?MODEL_BASE_URL is required}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-15000}
      MODEL_MAX_RETRIES: ${MODEL_MAX_RETRIES:-1}
      OPERATOR_PUBLIC_ORIGIN: https://app.msljkj.cn
      OPERATOR_COOKIE_SECURE: "true"
      VIDEO_STORAGE_MODE: disabled
    command: sh -c "npm run migrate && npm start"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
