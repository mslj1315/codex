server {
    listen 80;
    listen [::]:80;
    server_name app.msljkj.cn;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.msljkj.cn;

    ssl_certificate /etc/letsencrypt/live/app.msljkj.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.msljkj.cn/privkey.pem;

    client_max_body_size 5m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location = /downloads/restaurant-operations-cloud-test.apk {
        alias /var/www/restaurant-ops-downloads/restaurant-operations-cloud-test.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition "attachment; filename=restaurant-operations-cloud-test.apk" always;
        autoindex off;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
