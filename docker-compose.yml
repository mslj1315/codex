services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      PORT: 3000
      LOCAL_CONTAINER_DEVELOPMENT_MODE: "true"
      PROVIDER_BROWSER_DEVELOPMENT_MODE: ${PROVIDER_BROWSER_DEVELOPMENT_MODE:-false}
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    command: sh -c "npm run migrate && npm start"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10

  import-cleanup:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      PORT: 3000
      LOCAL_CONTAINER_DEVELOPMENT_MODE: "true"
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    command: sh -c "npm run migrate && npm run cleanup:imports"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  import-reconciliation:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      PORT: 3000
      LOCAL_CONTAINER_DEVELOPMENT_MODE: "true"
      DATABASE_URL: ${DATABASE_URL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    command: sh -c "npm run migrate && npm run reconcile:imports"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  import-maintenance-status:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: sh -c "npm run migrate && npm run maintenance:status"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: import_postgres_data
  minio_data:
    name: import_minio_data
